name: Construire APK Android - Billy-eLBERT STOCK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python 3.11 (requis par le deploiement Android)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verifier l'environnement
        run: |
          echo "=== PYTHON ==="
          python --version
          echo "=== PIP ==="
          python -m pip --version
          echo "=== JAVA ==="
          java -version

      - name: Installer dependances Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl wget build-essential \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses-dev cmake libffi-dev libssl-dev \
            libdouble-conversion3

      - name: Mettre a jour pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Installer PySide6
        run: |
          python -m pip install "PySide6==6.11.2"

      - name: Installer Buildozer et Cython
        run: |
          python -m pip install "Cython<3.2"
          python -m pip install buildozer

      - name: Telecharger le code source officiel Qt for Python
        run: |
          git clone --depth 1 --branch 6.11.2 https://code.qt.io/pyside/pyside-setup.git pyside-setup
          echo "Version Qt for Python verrouillee sur 6.11.2 pour correspondre aux roues Android."
          git -C pyside-setup describe --tags --always

      - name: Installer toutes les dependances du compilateur Android Qt
        run: |
          python -m pip install -r pyside-setup/requirements.txt
          python -m pip install -r pyside-setup/tools/cross_compile_android/requirements.txt
          python -m pip install jinja2
          echo "Les roues Android seront telechargees depuis les archives officielles Qt, sans qtpip commercial."

      - name: Telecharger les outils Android Qt
        run: |
          python pyside-setup/tools/cross_compile_android/main.py \
            --download-only \
            --skip-update \
            --auto-accept-license

      - name: Telecharger PySide6 Android ARM64 depuis Qt officiel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-wheels
          cd android-wheels
          BASE="https://download.qt.io/official_releases/QtForPython"
          PYSIDE_FILE="pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"
          SHIBOKEN_FILE="shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$BASE/pyside6/$PYSIDE_FILE" -o "$PYSIDE_FILE"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$BASE/shiboken6/$SHIBOKEN_FILE" -o "$SHIBOKEN_FILE"
          echo "=== Verification des roues Android officielles ==="
          ls -lh *.whl
          echo "c5288e0740ad91d87d4cafa16132768c149c56521bf63c83c98404b865911678  $PYSIDE_FILE" | sha256sum -c -
          echo "e99609b689d3df2ac97ffbe17df0ce8b1246b2c47b4d24f6fb73f1eaad4bd0f2  $SHIBOKEN_FILE" | sha256sum -c -
          python - <<'PYWHEELS'
          from pathlib import Path
          from zipfile import ZipFile
          files = list(Path('.').glob('*.whl'))
          assert len(files) == 2, f"Deux roues attendues, trouvees: {len(files)}"
          for f in files:
              with ZipFile(f) as z:
                  assert z.testzip() is None, f"Archive corrompue: {f}"
              print(f"OK archive: {f} ({f.stat().st_size} octets)")
          PYSIDE = next(f for f in files if f.name.startswith('pyside6-'))
          SHIBOKEN = next(f for f in files if f.name.startswith('shiboken6-'))
          with open(Path(__import__('os').environ['GITHUB_ENV']), 'a') as env:
              env.write(f"PYSIDE_WHEEL={PYSIDE.resolve()}\n")
              env.write(f"SHIBOKEN_WHEEL={SHIBOKEN.resolve()}\n")
          PYSIDE_WHEEL = PYSIDE
          SHIBOKEN_WHEEL = SHIBOKEN
          PYWHEELS

      - name: Verifier le projet
        run: |
          echo "=== CONTENU DU DEPOT ==="
          ls -la
          if [ ! -f main.py ]; then
            echo "::error::main.py introuvable"
            exit 1
          fi
          python -m py_compile main.py
          if [ -d Ressources ]; then
            echo "=== DOSSIER RESSOURCES ==="
            find Ressources -type f -print
          else
            echo "::warning::Dossier Ressources absent"
          fi

      - name: Installer les dependances de deploiement Android
        run: |
          REQUIREMENTS_ANDROID="$(python -c 'import pathlib, PySide6; print(pathlib.Path(PySide6.__file__).parent / "scripts" / "requirements-android.txt")')"
          echo "Fichier de dependances : $REQUIREMENTS_ANDROID"
          test -f "$REQUIREMENTS_ANDROID"
          python -m pip install -r "$REQUIREMENTS_ANDROID"
          python -m pip install pkginfo
          python -m pip show pkginfo

      - name: Construire APK Android
        run: |
          pyside6-android-deploy \
            --force \
            --verbose \
            --name "Billy-eLBERT STOCK" \
            --wheel-pyside="$PYSIDE_WHEEL" \
            --wheel-shiboken="$SHIBOKEN_WHEEL"

      - name: Rechercher APK genere
        run: |
          echo "=== RECHERCHE APK ==="
          find . -type f -name "*.apk" -not -path "./.git/*"

      - name: Preparer APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-apk
          APK="$(find . -type f -name "*.apk" \
            -not -path "./.git/*" \
            -not -path "./android-wheels/*" \
            | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Aucun APK genere"
            find . -maxdepth 7 -type f -name "*.log" -print
            exit 1
          fi
          cp "$APK" dist-apk/Billy-eLBERT-STOCK-ARM64.apk
          sha256sum dist-apk/Billy-eLBERT-STOCK-ARM64.apk \
            > dist-apk/SHA256SUMS.txt
          ls -lh dist-apk/

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Billy-eLBERT-STOCK-APK-ARM64
          path: dist-apk/*
          if-no-files-found: error
          retention-days: 14
