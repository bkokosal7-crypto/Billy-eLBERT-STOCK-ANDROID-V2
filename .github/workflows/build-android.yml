name: Construire APK Android - Billy-eLBERT STOCK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verifier l'environnement
        run: |
          echo "=== PYTHON ==="
          python --version
          echo "=== PIP ==="
          python -m pip --version
          echo "=== JAVA ==="
          java -version

      - name: Installer dependances Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl wget build-essential \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses-dev cmake libffi-dev libssl-dev

      - name: Mettre a jour pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Installer PySide6
        run: |
          python -m pip install "PySide6==6.11.2"

      - name: Installer Buildozer et Cython
        run: |
          python -m pip install "Cython<3.2"
          python -m pip install buildozer

      - name: Telecharger le code source officiel Qt for Python
        run: |
          git clone --depth 1 https://code.qt.io/pyside/pyside-setup.git pyside-setup

      - name: Installer toutes les dependances du compilateur Android Qt
        run: |
          python -m pip install -r pyside-setup/requirements.txt
          python -m pip install -r pyside-setup/tools/cross_compile_android/requirements.txt
          python -m pip install jinja2

      - name: Telecharger les outils Android Qt
        run: |
          python pyside-setup/tools/cross_compile_android/main.py \
            --download-only \
            --skip-update \
            --auto-accept-license

      - name: Telecharger PySide6 Android ARM64
        run: |
          mkdir -p android-wheels
          cd android-wheels
          qtpip download PySide6 --android --arch aarch64
          echo "=== Fichiers trouves ==="
          find . -maxdepth 1 -type f -print
          PYSIDE_WHEEL="$(find . -maxdepth 1 -type f -iname 'pyside6-*.whl' | head -n 1)"
          SHIBOKEN_WHEEL="$(find . -maxdepth 1 -type f -iname 'shiboken6-*.whl' | head -n 1)"
          if [ -z "$PYSIDE_WHEEL" ]; then
            echo "::error::Wheel PySide6 Android introuvable"
            exit 1
          fi
          if [ -z "$SHIBOKEN_WHEEL" ]; then
            echo "::error::Wheel Shiboken6 Android introuvable"
            exit 1
          fi
          echo "PYSIDE_WHEEL=$PWD/$PYSIDE_WHEEL" >> "$GITHUB_ENV"
          echo "SHIBOKEN_WHEEL=$PWD/$SHIBOKEN_WHEEL" >> "$GITHUB_ENV"

      - name: Verifier le projet
        run: |
          echo "=== CONTENU DU DEPOT ==="
          ls -la
          if [ ! -f main.py ]; then
            echo "::error::main.py introuvable"
            exit 1
          fi
          python -m py_compile main.py
          if [ -d Ressources ]; then
            echo "=== DOSSIER RESSOURCES ==="
            find Ressources -type f -print
          else
            echo "::warning::Dossier Ressources absent"
          fi

      - name: Construire APK Android
        run: |
          pyside6-android-deploy \
            --force \
            --verbose \
            --name "Billy-eLBERT STOCK" \
            --wheel-pyside="$PYSIDE_WHEEL" \
            --wheel-shiboken="$SHIBOKEN_WHEEL"

      - name: Rechercher APK genere
        run: |
          echo "=== RECHERCHE APK ==="
          find . -type f -name "*.apk" -not -path "./.git/*"

      - name: Preparer APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-apk
          APK="$(find . -type f -name "*.apk" \
            -not -path "./.git/*" \
            -not -path "./android-wheels/*" \
            | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Aucun APK genere"
            find . -maxdepth 7 -type f -name "*.log" -print
            exit 1
          fi
          cp "$APK" dist-apk/Billy-eLBERT-STOCK-ARM64.apk
          sha256sum dist-apk/Billy-eLBERT-STOCK-ARM64.apk \
            > dist-apk/SHA256SUMS.txt
          ls -lh dist-apk/

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Billy-eLBERT-STOCK-APK-ARM64
          path: dist-apk/*
          if-no-files-found: error
          retention-days: 14
