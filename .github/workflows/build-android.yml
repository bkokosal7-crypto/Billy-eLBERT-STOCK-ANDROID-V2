name: Build Billy-eLBERT STOCK

on:
  workflow_dispatch:

jobs:
  verify-project:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer dependances
        run: |
          python -m pip install --upgrade pip

          pip install PySide6
          pip install reportlab

      - name: Verifier le code
        run: |
          python -m py_compile main.py

      - name: Verifier ressources
        run: |
          ls -la

          if [ -d Ressources ]; then
            find Ressources -type f
          fi
