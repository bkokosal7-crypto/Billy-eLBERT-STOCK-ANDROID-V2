
name: Construire APK Android - Billy-eLBERT STOCK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "main.py"
      - "Ressources/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python et Java
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer les outils de base
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip curl wget build-essential autoconf automake libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip setuptools wheel

      - name: Installer PySide6 et Buildozer
        run: |
          python -m pip install "PySide6==6.11.2"
          python -m pip install "Cython<3.2" buildozer

      - name: Telecharger les outils Android Qt
        run: |
          git clone --depth 1 https://code.qt.io/pyside/pyside-setup.git /tmp/pyside-setup
          python /tmp/pyside-setup/tools/cross_compile_android/main.py --download-only --skip-update --auto-accept-license

      - name: Telecharger PySide6 Android ARM64
        run: |
          mkdir -p android-wheels
          cd android-wheels
          qtpip download PySide6 --android --arch aarch64
          PYSIDE_WHEEL="$(find "$PWD" -maxdepth 1 -type f -iname 'pyside6-*.whl' | head -n 1)"
          SHIBOKEN_WHEEL="$(find "$PWD" -maxdepth 1 -type f -iname 'shiboken6-*.whl' | head -n 1)"
          test -n "$PYSIDE_WHEEL"
          test -n "$SHIBOKEN_WHEEL"
          echo "PYSIDE_WHEEL=$PYSIDE_WHEEL" >> "$GITHUB_ENV"
          echo "SHIBOKEN_WHEEL=$SHIBOKEN_WHEEL" >> "$GITHUB_ENV"

      - name: Verifier le projet
        run: |
          test -f main.py
          python -m py_compile main.py
          if [ -d Ressources ]; then
            find Ressources -maxdepth 2 -type f -print
          else
            echo "::warning::Dossier Ressources absent"
          fi

      - name: Construire APK ARM64
        run: |
          pyside6-android-deploy --force --verbose --name "Billy-eLBERT STOCK" \
            --wheel-pyside="$PYSIDE_WHEEL" \
            --wheel-shiboken="$SHIBOKEN_WHEEL" \
            --extra-ignore-dirs ".git,.github,.venv,venv,build,dist,android-wheels,__pycache__"

      - name: Preparer le fichier APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-apk
          APK="$(find . -type f -name '*.apk' -not -path './.git/*' -not -path './.venv/*' -not -path './venv/*' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Aucun APK n'a ete produit"
            find . -maxdepth 6 -type f -name '*.log' -print
            exit 1
          fi
          cp "$APK" dist-apk/Billy-eLBERT-STOCK-ARM64.apk
          sha256sum dist-apk/Billy-eLBERT-STOCK-ARM64.apk > dist-apk/SHA256SUMS.txt
          ls -lh dist-apk/

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Billy-eLBERT-STOCK-APK-ARM64
          path: dist-apk/*
          if-no-files-found: error
          retention-days: 14
